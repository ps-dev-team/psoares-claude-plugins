<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review</title>
<style>
  :root { --bg: #f5f6f8; --card: #fff; --line: #e3e5ea; --text: #1d1f24; --muted: #6b7080; --accent: #0a84ff; --warn: #e08a00; --pin: #e5484d; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: grid; grid-template-columns: 1fr 360px; grid-template-rows: 1fr auto; }
  main { padding: 16px 16px 8px; display: flex; flex-direction: column; min-height: 0; }
  .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  video { max-width: 100%; max-height: 100%; border-radius: 8px; background: #000; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .bar { display: flex; align-items: center; gap: 12px; padding: 10px 2px 0; }
  .bar .time { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 120px; }
  .bar .now { flex: 1; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: var(--card); }
  footer { grid-column: 1 / 2; padding: 0 16px 14px; }
  .tl { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; overflow-y: hidden; position: relative; user-select: none; }
  .tl-inner { position: relative; }
  .row { position: relative; height: 26px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row.script { height: 40px; }
  .label { position: sticky; left: 0; z-index: 3; width: 74px; height: 100%; display: flex; align-items: center; padding-left: 8px; background: var(--card); color: var(--muted); font-size: 11px; border-right: 1px solid var(--line); }
  .item { position: absolute; top: 4px; bottom: 4px; border-radius: 4px; font-size: 11px; padding: 0 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; display: flex; align-items: center; }
  .scene { background: #eef0f4; color: var(--muted); }
  .line { background: #e8f1ff; color: #24476e; line-height: 1.2; white-space: normal; align-items: flex-start; padding-top: 2px; }
  .line.on { background: #cfe3ff; }
  .gap { background: repeating-linear-gradient(45deg, #fff1d6, #fff1d6 4px, #ffe4ad 4px, #ffe4ad 8px); color: #8a5a00; }
  .zoom { background: #ead9ff; color: #5b2c99; }
  .tick { position: absolute; top: 3px; bottom: 3px; width: 2px; border-radius: 1px; }
  .tick span { position: absolute; left: 4px; top: 1px; font-size: 10px; white-space: nowrap; color: var(--muted); }
  .click { background: #9aa0ad; }
  .event { background: var(--accent); }
  .note { background: var(--warn); }
  .pin { background: var(--pin); width: 3px; cursor: pointer; }
  .pin.done { background: #2ea44f; }
  .head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--pin); z-index: 4; pointer-events: none; }
  .zoomctl { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; padding: 6px 2px 0; }
  aside { grid-row: 1 / 3; grid-column: 2; background: var(--card); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside h2 { font-size: 13px; margin: 0; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  .list { overflow-y: auto; flex: 1; }
  .c { padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .c:hover { background: #fafbfc; }
  .c .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-bottom: 6px; }
  .c img { width: 100%; border-radius: 4px; border: 1px solid var(--line); margin-bottom: 6px; }
  .c .text { white-space: pre-wrap; }
  .c .reply { margin-top: 8px; padding: 8px; background: #f0f7f1; border-radius: 6px; white-space: pre-wrap; }
  .c .status { font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: .04em; }
  .status.open { color: var(--pin); } .status.done { color: #2ea44f; } .status.answered { color: var(--accent); }
  .c .del { border: 0; background: none; color: var(--muted); padding: 0; font-size: 11px; }
  .compose { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(560px, 90%); background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.18); padding: 10px; display: none; z-index: 10; }
  .compose.on { display: block; }
  .compose textarea { width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: inherit; resize: vertical; }
  .compose .row2 { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: var(--muted); font-size: 11px; }
  .empty { padding: 16px; color: var(--muted); }
  /* The timeline is dark, like an editor's. */
  footer { background: #17181c; padding-top: 12px; }
  footer .tl { background: #1f2026; border-color: #2c2e36; }
  footer .row { border-bottom-color: #2c2e36; }
  footer .label { background: #1f2026; color: #8b90a0; border-right-color: #2c2e36; }
  footer .scene { background: #2c2e36; color: #b4b8c4; }
  footer .line { background: #1d3557; color: #cfe0ff; }
  footer .line.on { background: #2f5fa3; color: #fff; }
  footer .gap { background: repeating-linear-gradient(45deg, #4a3a14, #4a3a14 4px, #5c4818 4px, #5c4818 8px); color: #ffd37a; }
  footer .zoom { background: #3d2a63; color: #d9c3ff; }
  footer .tick span { color: #a3a8b6; }
  footer .click { background: #6b7080; }
  footer .event { background: #3d9bff; }
  footer .note { background: #f0a020; }
  footer .head { background: #ff5a5f; }
  footer .zoomctl { color: #8b90a0; }
  footer kbd { background: #2c2e36; border-color: #3a3c46; color: #d0d3dc; }
  footer input[type=range] { accent-color: #3d9bff; }
</style>
</head>
<body>
<main>
  <div class="stage">
    <video id="v" preload="auto"></video>
    <div class="compose" id="compose">
      <textarea id="text" placeholder="What should change at this moment?"></textarea>
      <div class="row2"><span id="at"></span><span><kbd>Enter</kbd> save · <kbd>Shift</kbd>+<kbd>Enter</kbd> new line · <kbd>Esc</kbd> cancel</span></div>
    </div>
  </div>
  <div class="bar">
    <button id="play">Play</button>
    <span class="time" id="time">0:00.00</span>
    <span class="now" id="now"></span>
    <button class="primary" id="add">Comment here <kbd style="background:transparent;color:#fff;border-color:rgba(255,255,255,.5)">C</kbd></button>
  </div>
</main>
<footer>
  <div class="tl" id="tl"><div class="tl-inner" id="inner"></div></div>
  <div class="zoomctl">
    <span>Timeline zoom</span><input type="range" id="scale" min="4" max="80" value="14">
    <span><kbd>Space</kbd> play · <kbd>←</kbd><kbd>→</kbd> one frame · <kbd>Shift</kbd> one second · <kbd>C</kbd> comment</span>
  </div>
</footer>
<aside>
  <h2><span id="title">Review</span><span id="count"></span></h2>
  <div class="list" id="list"></div>
</aside>
<script>
const $ = (id) => document.getElementById(id);
const v = $('v');
let data = null, pxs = 14, mtime = 0;
const fmt = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(2).padStart(5, '0')}`;
const LABELS = { loop: 'loop', underline: 'underline', shake: 'shake', box: 'selection box', select: 'select text', drag: 'drag', type: 'typing' };

async function load(first) {
  const d = await (await fetch('/data')).json();
  if (first || d.mtime !== mtime) {
    const t = v.currentTime; mtime = d.mtime;
    v.src = '/video?' + d.mtime;
    if (!first) v.currentTime = t;
  }
  data = d;
  $('title').textContent = `${d.id} · ${d.video ?? 'no video yet'}`;
  draw(); comments();
}

function draw() {
  const tl = data.timeline, inner = $('inner');
  const len = tl?.length ?? v.duration ?? 0;
  const X = (t) => 74 + t * pxs;
  inner.style.width = X(len) + 20 + 'px';
  inner.innerHTML = '';
  const row = (name, cls = '') => { const r = document.createElement('div'); r.className = 'row ' + cls; r.innerHTML = `<div class="label">${name}</div>`; inner.append(r); return r; };
  const span = (r, a, b, cls, text, title) => { const e = document.createElement('div'); e.className = 'item ' + cls; e.style.left = X(a) + 'px'; e.style.width = Math.max(3, (b - a) * pxs - 2) + 'px'; e.textContent = text ?? ''; e.title = title ?? text ?? ''; r.append(e); return e; };
  const tick = (r, t, cls, text, title) => { const e = document.createElement('div'); e.className = 'tick ' + cls; e.style.left = X(t) + 'px'; if (text) e.innerHTML = `<span>${text}</span>`; e.title = title ?? text ?? ''; r.append(e); return e; };
  if (tl) {
    const sc = row('Scenes');
    tl.segments.forEach((s, i) => span(sc, s.start, tl.segments[i + 1]?.start ?? len, 'scene', s.name));
    const sr = row('Script', 'script');
    tl.lines.forEach((l) => { const e = span(sr, l.start, l.end, 'line', l.text); e.dataset.i = l.i; });
    const gr = row('Pauses');
    tl.gaps.forEach((g) => span(gr, g.t - g.seconds / 2, g.t + g.seconds / 2, 'gap', `${g.seconds}s`, `${g.seconds}s pause before line ${g.line}`));
    const zr = row('Zoom');
    tl.zooms.forEach((z, i) => { if (z.scale > 1) { const end = tl.zooms.slice(i + 1).find((n) => n.scale <= 1)?.t ?? len; span(zr, z.t, end, 'zoom', `${z.scale}×`); } });
    const er = row('Specials');
    tl.events.forEach(([t, k]) => tick(er, t, 'event', LABELS[k] ?? k));
    const cr = row('Clicks');
    tl.clicks.forEach((t) => tick(cr, t, 'click', '', fmt(t)));
    const nr = row('Warnings');
    tl.notes.forEach(([t, m]) => tick(nr, t, 'note', '', `${fmt(t)} ${m}`));
  }
  const pr = row('Comments');
  data.review.comments.forEach((c) => { const e = tick(pr, c.t, 'pin ' + (c.status === 'open' ? '' : 'done'), `#${c.n}`, c.text); e.onclick = (ev) => { ev.stopPropagation(); seek(c.t); }; });
  const head = document.createElement('div'); head.className = 'head'; head.id = 'head'; inner.append(head);
  playhead();
}

function comments() {
  const list = $('list'), cs = data.review.comments;
  $('count').textContent = cs.length ? `${cs.filter((c) => c.status === 'open').length} open / ${cs.length}` : '';
  list.innerHTML = cs.length ? '' : '<div class="empty">No comments yet. Pause where something should change and press C.</div>';
  for (const c of [...cs].sort((a, b) => a.t - b.t)) {
    const e = document.createElement('div'); e.className = 'c';
    e.innerHTML = `<div class="meta"><span>#${c.n} · ${fmt(c.t)}</span><span class="status ${c.status}">${c.status}</span></div>`
      + (c.still ? `<img src="/still/${c.still.split('/').pop()}">` : '')
      + `<div class="text"></div>` + (c.reply ? `<div class="reply"></div>` : '')
      + (c.status === 'open' ? `<button class="del">Delete</button>` : '');
    e.querySelector('.text').textContent = c.text;
    if (c.reply) e.querySelector('.reply').textContent = c.reply;
    e.onclick = () => seek(c.t);
    const del = e.querySelector('.del');
    if (del) del.onclick = async (ev) => { ev.stopPropagation(); await fetch('/comment', { method: 'DELETE', body: JSON.stringify({ n: c.n }) }); load(); };
    list.append(e);
  }
}

function playhead() {
  const t = v.currentTime || 0, head = $('head');
  if (head) head.style.left = 74 + t * pxs + 'px';
  $('time').textContent = fmt(t);
  const line = data?.timeline?.lines.find((l) => t >= l.start && t <= l.end);
  $('now').textContent = line ? line.text : '';
  document.querySelectorAll('.line').forEach((e) => e.classList.toggle('on', line && +e.dataset.i === line.i));
  if (!v.paused) { const tl = $('tl'), x = 74 + t * pxs; if (x > tl.scrollLeft + tl.clientWidth - 80 || x < tl.scrollLeft + 74) tl.scrollLeft = x - 200; }
}

const seek = (t) => { v.currentTime = Math.max(0, Math.min(t, v.duration || t)); playhead(); };
$('tl').addEventListener('mousedown', (e) => {
  const r = $('inner').getBoundingClientRect();
  const at = (ev) => seek((ev.clientX - r.left - 74) / pxs);
  at(e);
  const move = (ev) => at(ev), up = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
  addEventListener('mousemove', move); addEventListener('mouseup', up);
});
$('scale').oninput = (e) => { pxs = +e.target.value; draw(); };
$('play').onclick = () => (v.paused ? v.play() : v.pause());
v.onplay = () => { $('play').textContent = 'Pause'; };
v.onpause = () => { $('play').textContent = 'Play'; };
v.ontimeupdate = playhead;
v.onloadedmetadata = () => { if (!data?.timeline) draw(); };
(function loop() { if (!v.paused) playhead(); requestAnimationFrame(loop); })();

let pinned = 0;
function compose() {
  v.pause(); pinned = v.currentTime;
  $('at').textContent = `At ${fmt(pinned)}`;
  $('compose').classList.add('on'); $('text').value = ''; $('text').focus();
}
function still() {
  const c = document.createElement('canvas'), w = 960;
  c.width = w; c.height = Math.round(w * v.videoHeight / v.videoWidth);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.82);
}
async function save() {
  const text = $('text').value.trim();
  $('compose').classList.remove('on');
  if (!text) return;
  await fetch('/comment', { method: 'POST', body: JSON.stringify({ t: pinned, text, still: still() }) });
  load();
}
$('add').onclick = compose;
$('text').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); save(); }
  if (e.key === 'Escape') { $('compose').classList.remove('on'); }
  e.stopPropagation();
});
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.key === ' ') { e.preventDefault(); v.paused ? v.play() : v.pause(); }
  if (e.key === 'c' || e.key === 'C') { e.preventDefault(); compose(); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); v.pause(); seek(v.currentTime + (e.key === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 1 : 1 / 60)); }
});
load(true);
setInterval(load, 3000);
</script>
</body>
</html>
